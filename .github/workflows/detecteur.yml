name: Détecteur de demande

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relevé de l'Apify Store
        run: python detecteur.py

      - name: Enregistrer le rapport et l'historique
        run: |
          git config user.name "detecteur-bot"
          git config user.email "detecteur-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Relevé du $(date -u +%Y-%m-%d)"
          git push
